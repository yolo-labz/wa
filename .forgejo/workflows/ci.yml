# Forgejo CI-of-record for the Go gates (fleet migration off GitHub Actions,
# Pedro 22/10/2026). `.forgejo/` is invisible to GitHub, so this adds no GitHub
# dispatch. Each job reports its verdict back to GitHub as the commit status
# `forgejo/<job>` via scripts/forgejo-gh-status.sh; those contexts are the
# required checks. Keep job ids stable: they are the bridge's identity.
#
# Ported from .github/workflows/ci.yml (detect/lint/test/nix). Not ported, and
# why:
#   - PR title commitlint: Forgejo only sees pushes (PRs live on GitHub), so the
#     pull_request title is never available here. Stays on GitHub.
#   - sonar: consumes the GitHub test job's coverage artifact; moves in a later
#     slice together with that job.
#   - step-security/harden-runner, upload-artifact: GitHub-only.
#
# Lanes: `ubuntu-latest` is the runner's act container (catthehacker 22.04, has
# gcc for -race; wa's sqlite is pure-Go modernc). `X64` is the host lane, used
# only by `nix` because it needs the host /nix/store. The host lane mounts the
# workdir noexec, so nothing there executes a binary from the checkout.
name: CI
on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report pending
        continue-on-error: true
        env:
          GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
          GH_REPO: yolo-labz/wa
          GH_SHA: ${{ github.sha }}
          STATUS_CONTEXT: forgejo/lint
          STATUS_STATE: pending
          STATUS_DESC: Forgejo CI running
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/forgejo-gh-status.sh
      # R-01..R-13 removal-inventory drift check (feature 018 §Removal
      # inventory); same patterns as .github/workflows/ci.yml `detect`.
      - name: detect R-01..R-13 residue
        run: |
          set -eu
          patterns=(
            'R-01:MediaMessage send not yet implemented'
            'R-02:ReactionMessage send not yet implemented'
            'R-03:if f.Safety != nil'
            'R-09:Client.MarkRead(waChat, waChat'
            'R-12:ProtoVersion == 1'
            'R-12:"protoVersion":1'
            'R-12:handleV1'
            'R-12:dispatchV1'
          )
          files=$(find cmd internal -name '*.go' ! -name '*_test.go' -type f)
          fail=0
          for entry in "${patterns[@]}"; do
            id="${entry%%:*}"
            pat="${entry#*:}"
            hits=$(printf "%s\n" "$files" | xargs grep -nF -- "$pat" || true)
            if [ -n "$hits" ]; then
              echo "$id residue re-entered tree — pattern: $pat"
              printf "%s\n" "$hits"
              fail=1
            fi
          done
          exit "$fail"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # Same pin as GitHub ci.yml (v2.12.2: no SA5011 false positives).
          version: v2.12.2
      - name: Status bridge → GitHub (forgejo/lint)
        if: always()
        continue-on-error: true
        env:
          GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
          GH_REPO: yolo-labz/wa
          GH_SHA: ${{ github.sha }}
          STATUS_CONTEXT: forgejo/lint
          STATUS_STATE: ${{ job.status }}
          STATUS_DESC: Forgejo CI golangci-lint + residue check
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/forgejo-gh-status.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report pending
        continue-on-error: true
        env:
          GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
          GH_REPO: yolo-labz/wa
          GH_SHA: ${{ github.sha }}
          STATUS_CONTEXT: forgejo/test
          STATUS_STATE: pending
          STATUS_DESC: Forgejo CI running
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/forgejo-gh-status.sh
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go mod verify
        run: go mod verify
      - name: go test
        # A short writable TMPDIR: cmd/wad's unix-socket tests need a path that
        # fits the 108-byte sun_path. -shuffle=on and -count=1 as on GitHub.
        env:
          GOFLAGS: -mod=readonly
        run: |
          mkdir -p "$HOME/.wa-test-tmp"
          TMPDIR="$HOME/.wa-test-tmp" go test -race -shuffle=on -count=1 \
            -covermode=atomic -coverprofile=cover.out ./...
      - name: coverage thresholds
        # Same ratchet floors as GitHub ci.yml (spec 016 FR-020 / T072).
        env:
          DOMAIN_THRESHOLD: "60"
          APP_THRESHOLD: "50"
          ADAPTERS_THRESHOLD: "55"
        run: bash .github/scripts/check-coverage.sh
      - name: Status bridge → GitHub (forgejo/test)
        if: always()
        continue-on-error: true
        env:
          GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
          GH_REPO: yolo-labz/wa
          GH_SHA: ${{ github.sha }}
          STATUS_CONTEXT: forgejo/test
          STATUS_STATE: ${{ job.status }}
          STATUS_DESC: Forgejo CI go test -race + coverage floors
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/forgejo-gh-status.sh

  nix:
    runs-on: X64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report pending
        continue-on-error: true
        env:
          GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
          GH_REPO: yolo-labz/wa
          GH_SHA: ${{ github.sha }}
          STATUS_CONTEXT: forgejo/nix
          STATUS_STATE: pending
          STATUS_DESC: Forgejo CI running
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/forgejo-gh-status.sh
      - name: nix flake check
        run: nix --extra-experimental-features 'nix-command flakes' flake check --no-build --accept-flake-config
      - name: nix build + smoke test
        # --no-link: the binary is run from /nix/store, never from the noexec
        # workdir, and no result symlink is left behind on the host lane.
        run: |
          out=$(nix --extra-experimental-features 'nix-command flakes' build .#default \
            --no-link --print-out-paths --print-build-logs --accept-flake-config)
          "$out/bin/wa" version
          "$out/bin/wa" --help | head -5
      - name: Status bridge → GitHub (forgejo/nix)
        if: always()
        continue-on-error: true
        env:
          GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
          GH_REPO: yolo-labz/wa
          GH_SHA: ${{ github.sha }}
          STATUS_CONTEXT: forgejo/nix
          STATUS_STATE: ${{ job.status }}
          STATUS_DESC: Forgejo CI nix flake check + build
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/forgejo-gh-status.sh
