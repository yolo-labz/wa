name: actionlint + zizmor

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actionlint*"
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scan:
    name: workflow static analysis
    # Self-hosted dokku pool — same as ci/release/osv/repro/gitleaks.
    runs-on: [self-hosted, dokku]
    timeout-minutes: 5
    permissions:
      # contents: read — checkout the repo source for the static-
      # analysis pass. actionlint + zizmor only read workflow files;
      # no SARIF upload surface here (zizmor stays in audit mode).
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # actionlint v1.7.12 — pinned tarball + sha256 verify (closes the
      # OpenSSF Scorecard `Pinned-Dependencies` gap that landed via
      # PR #52 for syft). Bump version + sha in lockstep.
      - name: Install actionlint
        run: |
          set -eu
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_AMD64_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ACTIONLINT_ARM64_SHA256="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) tarball_arch="amd64"; expected_sha="$ACTIONLINT_AMD64_SHA256" ;;
            aarch64|arm64) tarball_arch="arm64"; expected_sha="$ACTIONLINT_ARM64_SHA256" ;;
            *) echo "::error::unsupported arch for actionlint: $arch"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_${tarball_arch}.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          actual_sha="$(sha256sum "/tmp/${tarball}" | awk '{print $1}')"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::actionlint tarball sha256 mismatch — expected $expected_sha got $actual_sha"
            exit 1
          fi
          tar xzf "/tmp/${tarball}" -C "$HOME/.local/bin" actionlint
          rm "/tmp/${tarball}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/actionlint" --version

      # zizmor v1.24.1 — pinned tarball + sha256 verify. zizmor is
      # the modern static-analysis gate for GitHub Actions workflow
      # injection / permissions / unpinned-action / cache-poisoning.
      - name: Install zizmor
        run: |
          set -eu
          ZIZMOR_VERSION="1.24.1"
          ZIZMOR_AMD64_SHA256="a8000f3c683319a523d3b20df0e75457ba591f049cfcbfa98966631b56733c03"
          ZIZMOR_ARM64_SHA256="d66e37ef8a375fb07939c630ebf9709a6e0f20242bdc3faf672a7ed97e0b768d"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) triple="x86_64-unknown-linux-gnu"; expected_sha="$ZIZMOR_AMD64_SHA256" ;;
            aarch64|arm64) triple="aarch64-unknown-linux-gnu"; expected_sha="$ZIZMOR_ARM64_SHA256" ;;
            *) echo "::error::unsupported arch for zizmor: $arch"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          tarball="zizmor-${triple}.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${tarball}"
          actual_sha="$(sha256sum "/tmp/${tarball}" | awk '{print $1}')"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::zizmor tarball sha256 mismatch — expected $expected_sha got $actual_sha"
            exit 1
          fi
          # zizmor's tarball is flat — `zizmor` binary at root, no
          # `zizmor-<triple>/` prefix. Verified via `tar tzf` 2026-04-26.
          tar xzf "/tmp/${tarball}" -C "$HOME/.local/bin" zizmor
          rm "/tmp/${tarball}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zizmor" --version

      - name: actionlint
        run: actionlint -color

      - name: zizmor enforce
        # Enforce mode (no `|| true`). The two-phase cleanup pass
        # has landed:
        #   - `cache-poisoning`        — fixed in PR #61.
        #   - `undocumented-permissions` — block + trailing comments,
        #     PRs #62..#65 + #69.
        #   - `artipacked`             — every checkout sets
        #     `persist-credentials: false` after PR #67.
        #   - `anonymous-definition`   — every job has `name:` after
        #     PR #69.
        # The `.github/zizmor.yml` keeps three structural exceptions
        # (`self-hosted-runner`, `concurrency-limits`,
        # `secrets-outside-env`) with documented rationale. Any new
        # finding fails the build until fixed or explicitly
        # suppressed there.
        run: |
          zizmor --persona=auditor --format=plain .github/workflows/
