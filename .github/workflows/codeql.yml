name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read          # CodeQL audits workflow files when matrix includes `language: actions` (injection / permission patterns).
      contents: read         # checkout source for the scan.
      security-events: write # upload CodeQL SARIF to GitHub Security tab.
    strategy:
      fail-fast: false
      matrix:
        include:
          # REL-12: manual build-mode + an explicit `go build ./...`, not
          # autobuild. autobuild guesses the build and silently analyses a
          # partial call graph when its guess is wrong — missed alerts with a
          # green check, the worst failure mode for a security gate. The
          # explicit build makes the analysed set the same one the release
          # builds, and a build break fails loudly right here.
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      # build-mode: manual — CodeQL observes this build instead of guessing.
      # Guarded to the Go leg; the actions leg (build-mode: none) analyses
      # workflow YAML without a build and must not run it. CGO_ENABLED=0 is
      # the repo-wide invariant (the shipped binary is CGO-free), so the
      # analysed artifacts match what actually releases.
      - name: Build (CodeQL manual mode)
        if: matrix.language == 'go'
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: Perform analysis
        uses: github/codeql-action/analyze@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          category: "/language:${{ matrix.language }}"
