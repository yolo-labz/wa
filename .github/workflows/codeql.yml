name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read          # CodeQL audits workflow files when matrix includes `language: actions` (injection / permission patterns).
      contents: read         # checkout source for the scan.
      security-events: write # upload CodeQL SARIF to GitHub Security tab.
    strategy:
      fail-fast: false
      matrix:
        include:
          # REL-12: `manual` + an explicit build, not `autobuild`. autobuild
          # guesses the build and silently analyses whatever it managed to
          # compile; an explicit `go build ./...` makes the analysed set the
          # same one CI builds, and a build break fails loudly here instead of
          # shrinking CodeQL's coverage without saying so.
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      # build-mode: manual — CodeQL observes this build. CGO_ENABLED=0 is the
      # repo-wide invariant (CLAUDE.md §Decisions), so the analysed binaries
      # match what ships.
      - name: Build (CodeQL manual mode)
        if: matrix.language == 'go'
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: Perform analysis
        uses: github/codeql-action/analyze@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          category: "/language:${{ matrix.language }}"
