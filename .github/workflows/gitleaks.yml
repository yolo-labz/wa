name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scan:
    name: gitleaks
    # Self-hosted dokku pool — same as ci/release/osv/repro. Fast on
    # warm runners; the gitleaks binary is ~6 MB and caches per-run.
    runs-on: [self-hosted, dokku]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout (full history)
        # Full history so gitleaks scans every commit on the PR, not just
        # the working tree. We run gitleaks as a binary (vendor-
        # independent) instead of the official Action which requires a
        # paid license for org-owned repos.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          if ! [ -x "$HOME/.local/bin/gitleaks" ]; then
            curl -sSL \
              https://github.com/gitleaks/gitleaks/releases/download/v8.21.4/gitleaks_8.21.4_linux_x64.tar.gz \
              | tar -xz -C "$HOME/.local/bin" gitleaks
            chmod +x "$HOME/.local/bin/gitleaks"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: gitleaks scan (PR diff)
        # SHAs are 40-char hex from GitHub's own commit DB — not user-
        # controlled input. Routed through env: anyway per the project's
        # workflow-hardening convention.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          gitleaks git \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --log-opts="$BASE_SHA..$HEAD_SHA"

      - name: gitleaks scan (full repo on push)
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          gitleaks git \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload SARIF
        # gitleaks v8 only writes the SARIF file when leaks are found.
        # `hashFiles` returns "" when the path is missing — skip upload
        # to avoid the "Path does not exist: gitleaks.sarif" error
        # surfaced as a failed step. The scan-step's exit code remains
        # the source of truth for the overall job result.
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v3.28.14
        with:
          sarif_file: gitleaks.sarif
