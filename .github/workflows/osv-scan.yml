name: OSV-Scanner

on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scan:
    name: OSV-Scanner
    # Self-hosted pool — same `[self-hosted, dokku]` runner that ci.yml
    # and release.yml use. Eliminates GHA hosted-runner minutes for the
    # weekly schedule cron + every PR.
    runs-on: [self-hosted, dokku]
    timeout-minutes: 10
    permissions:
      contents: read         # checkout source for the scan.
      security-events: write # upload SARIF to GitHub Security tab.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            --format sarif
            --output results.sarif
            .

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v3.28.14
        with:
          sarif_file: results.sarif
