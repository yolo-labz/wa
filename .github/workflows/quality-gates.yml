# Fleet quality gates (code-slop + alignment) on the PR diff — the CI layer of the
# Quality & Alignment Enforcement standard. Deterministic, runtime-LLM-free. The same
# two gates run as Claude Code / opencode / Codex hooks + git pre-commit (NixOS #974);
# this gates the diff server-side, independent of any host hook.
#   - code-slop-gate (aislop + jscpd): swallowed exceptions, as-any, narrative comments,
#     dead code, oversized functions, copy-paste.
#   - alignment-gate (zero-dep): TODO/stub/NotImplemented in "done" code, skipped/.only
#     tests, added lint-suppressions, debug artifacts, blast-radius.
# Source: github.com/yolo-labz/quality-gates (composite action, SHA-pinned below).

name: quality-gates

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gates:
    name: code-slop + alignment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0          # full history so the gates can diff the PR
          persist-credentials: false

      # wa PRs target main; the action diffs the PR against origin/main (its default).
      #
      # Pinned past the v1 tag (which still points at ee170b7) rather than moving
      # that tag. Measured 10/08/2026, SIX other repos consume this action by a
      # `uses:` line and still pin v1 — fand, portfolio, diploma-equivalence,
      # zellij-vertical-tabs, anthropic-throttle-proxy, and (until COC#207)
      # COC_BOT — so retagging would change all of them at once with no PR
      # anywhere. (An earlier version of this comment named Notes/Proso/NixOS;
      # those are prose mentions of the words "quality gates", not pins. The
      # decision was right, the evidence was not — and someone re-checking the
      # stated reason would have found it false and concluded retagging was safe.)
      #
      # This SHA adds the alignment gate's path-mode fix on top of #2..#4:
      # `{ A && B || C; }` used as if-then-else meant a failing path scan also
      # ran the diff scan. Latent here (the action always passes --base, i.e.
      # changes mode) but real for anyone running the gate by hand.
      - name: Quality gates on the PR diff
        uses: yolo-labz/quality-gates@7b358ecd200dec2feb3511f1a6106254022c6e22 # v1 + #2..#6
        with:
          base-ref: origin/main
          # This repo's scenarios live in features/ (the default), so the Gherkin
          # gate needs no path input. It is inside the already-required
          # "code-slop + alignment" check, so it gates without a new context.
          gherkin-fail-on: error
