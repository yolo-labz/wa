name: release

on:
  push:
    tags: ['v*']

permissions: {}

# Opt into Node.js 24 for JavaScript actions ahead of the June 2026
# default switch. Mirrors ci.yml.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # FR-053 gate. GA tags (v2.0.0, v2.1.0, ...) loud-fail when
  # Apple/Homebrew/git-cliff secrets are absent — releases MUST be
  # signed, notarized, and Homebrew-published. Pre-release tags
  # (-rc, -alpha, -beta) continue to silent-skip so rehearsals
  # work without the full secret matrix.
  preflight:
    runs-on: [self-hosted, dokku]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Classify tag
        id: classify
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG_NAME" in
            *-rc*|*-alpha*|*-beta*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "classified $TAG_NAME as prerelease (silent-skip permitted)"
              ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "classified $TAG_NAME as GA (FR-053 loud-fail enforced)"
              ;;
          esac

      - name: Verify GA secrets (FR-053)
        if: steps.classify.outputs.prerelease == 'false'
        env:
          APPLE_CERT: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT }}
          APPLE_KEY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_KEY }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -eu
          missing=""
          [ -n "${APPLE_CERT:-}" ]   || missing="$missing APPLE_DEVELOPER_ID_APPLICATION_CERT"
          [ -n "${APPLE_KEY:-}" ]    || missing="$missing APPLE_DEVELOPER_ID_APPLICATION_KEY"
          [ -n "${HOMEBREW_TOKEN:-}" ] || missing="$missing HOMEBREW_TAP_GITHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::FR-053: GA tag requires secrets$missing"
            exit 1
          fi
          echo "all GA secrets present"

  goreleaser:
    needs: preflight
    # Self-hosted runner pool (label set [self-hosted, dokku]). The
    # release job reuses the same runners as CI so the Go module
    # cache and Nix store are already warm from the main-branch CI
    # run that preceded the tag push.
    runs-on: [self-hosted, dokku]
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Export SOURCE_DATE_EPOCH
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$SDE" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$SDE (reproducible builds)"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          # cache: false — same rationale as ci.yml: persistent module
          # cache on the self-hosted runner conflicts with actions/cache.
          cache: false

      # Install rcodesign unconditionally into a user-writable bindir.
      # When Apple signing credentials are not set, the goreleaser
      # post-hook graceful-degrades per PR #10 — rcodesign itself is
      # cheap to install (~5 MB, no-op if already cached on the
      # self-hosted runner) and keeps the workflow schema simple.
      - name: Install rcodesign
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          if ! [ -x "$HOME/.local/bin/rcodesign" ]; then
            curl -sSL \
              https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz \
              | tar -xz --strip-components=1 -C "$HOME/.local/bin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rcodesign" --version

      - name: Decode Apple credentials
        # On GA tags preflight has already asserted secrets are set —
        # the else-branch here exists ONLY for prerelease classification
        # (silent-skip permitted per FR-053).
        env:
          APPLE_CERT: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT }}
          APPLE_KEY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_KEY }}
          APPLE_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -eu
          if [ -n "${APPLE_CERT:-}" ]; then
            printf '%s' "$APPLE_CERT" | base64 -d > /tmp/cert.pem
            printf '%s' "$APPLE_KEY"  | base64 -d > /tmp/key.pem
            printf '%s' "$APPLE_P8"   | base64 -d > /tmp/api.p8
            echo "apple_secrets=set" >> "$GITHUB_OUTPUT"
          else
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "::error::FR-053: GA build reached Apple decode with empty secrets"
              exit 1
            fi
            echo "prerelease: Apple secrets absent, rcodesign will skip"
            echo "apple_secrets=unset" >> "$GITHUB_OUTPUT"
          fi
        id: apple

      - name: Install cyclonedx-gomod
        # Pinned version — moving-tag `@latest` bit us once already on
        # goreleaser itself. The v1.9.0 release is the current stable
        # line (2025-08) with Go 1.24 compatibility.
        run: |
          set -eu
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install cosign
        run: |
          if ! command -v cosign >/dev/null 2>&1; then
            curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o "$HOME/.local/bin/cosign"
            chmod +x "$HOME/.local/bin/cosign"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Pinned to a version validated locally (2026-04-11). The
          # `latest` moving tag bit us once already — `v0.1.0` failed
          # because the config fields had renamed under us. Bumps
          # should happen via an explicit PR that re-runs
          # `goreleaser check` + `goreleaser release --snapshot`
          # locally first.
          version: v2.5.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If the tap secret is absent, export an empty string so the
          # goreleaser skip_upload template resolves to `true` and the
          # brew publication is skipped gracefully.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # rcodesign env vars are only exported when Apple secrets are
          # actually configured, so the inner sh -c check in the hook
          # detects the unset case and skips.
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.apple_secrets == 'set' && '/tmp/api.p8' || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          RCODESIGN_PEM_CERT: ${{ steps.apple.outputs.apple_secrets == 'set' && '/tmp/cert.pem' || '' }}
          RCODESIGN_PEM_KEY: ${{ steps.apple.outputs.apple_secrets == 'set' && '/tmp/key.pem' || '' }}

      - name: Generate SBOMs via syft (CycloneDX 1.6 + SPDX 2.3)
        # syft (anchore) currently supports CycloneDX up to 1.6 only; 1.7
        # is not yet in the syft output matrix as of this release. The
        # yolo-labz release-engineering spec calls for "1.7 or latest";
        # we hold at 1.6 until syft ships 1.7 support. Bump on sight when
        # `syft -o help` lists 1.7.
        run: |
          set -eu
          if ! command -v syft >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$HOME/.local/bin"
          fi
          syft . \
            -o cyclonedx-json@1.6=dist/sbom.cdx.json \
            -o spdx-json=dist/sbom.spdx.json

      - name: Generate Go-native SBOM via cyclonedx-gomod
        # Richer than syft's generic CycloneDX for Go modules: includes
        # stdlib + license info + per-binary scoping. One file per
        # binary. `-licenses` hits GitHub; `-std` records stdlib deps.
        run: |
          set -eu
          cyclonedx-gomod app -licenses -std -json \
            -output dist/sbom.gomod.wad.cdx.json ./cmd/wad
          cyclonedx-gomod app -licenses -std -json \
            -output dist/sbom.gomod.wa.cdx.json ./cmd/wa

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/checksums.txt'

      - name: Attest SBOM (CycloneDX 1.7)
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: 'dist/checksums.txt'
          sbom-path: 'dist/sbom.cdx.json'

      - name: Attest SBOM (SPDX 2.3)
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: 'dist/checksums.txt'
          sbom-path: 'dist/sbom.spdx.json'

      - name: Attest SBOM (Go-native, wad)
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: 'dist/checksums.txt'
          sbom-path: 'dist/sbom.gomod.wad.cdx.json'

      - name: Upload SBOMs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          gh release upload "$TAG_NAME" \
            dist/sbom.cdx.json \
            dist/sbom.spdx.json \
            dist/sbom.gomod.wad.cdx.json \
            dist/sbom.gomod.wa.cdx.json \
            --clobber

      - name: Install git-cliff
        # Pinned version. GA tags require git-cliff; prereleases can
        # survive pip failure via the conditional skip below.
        run: |
          set -eu
          pip install 'git-cliff==2.6.1'

      - name: Generate CHANGELOG
        # FR-053: GA MUST produce a CHANGELOG. Prereleases may silent-skip.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if ! git-cliff -o CHANGELOG.md; then
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "::error::FR-053: git-cliff failed on GA tag"
              exit 1
            fi
            echo "prerelease: git-cliff failed, skipping"
          fi

      # CHANGELOG.md is attached to the GitHub release page instead of
      # being pushed back to main. Pushing to a protected branch from
      # within a release workflow requires a PAT and is fragile; the
      # release notes themselves capture the same information. If
      # operators want a committed CHANGELOG.md they can run
      # `git-cliff -o CHANGELOG.md` locally and commit manually.
      - name: Attach CHANGELOG to release
        if: hashFiles('CHANGELOG.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          gh release upload "$TAG_NAME" CHANGELOG.md --clobber

  # Reproducibility gate. Builds wad twice with SOURCE_DATE_EPOCH
  # pinned and diffs the bytes — any drift is a reproducibility
  # regression (non-deterministic compilation, embedded timestamp,
  # path leak). Matrix over amd64+arm64 since go build behaviour
  # can differ across targets.
  reproducibility:
    needs: preflight
    runs-on: [self-hosted, dokku]
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          cache: false

      - name: Double-build and diff
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          set -eu
          export GOOS=linux
          export CGO_ENABLED=0
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          COMMIT=$(git rev-parse HEAD)
          CDATE=$(git log -1 --format=%cI)
          LDFLAGS="-s -w -X main.version=repro -X main.commit=$COMMIT -X main.date=$CDATE"

          go build -trimpath -buildvcs=true \
            -ldflags "$LDFLAGS" \
            -o /tmp/wad-1 ./cmd/wad
          sleep 2
          go build -trimpath -buildvcs=true \
            -ldflags "$LDFLAGS" \
            -o /tmp/wad-2 ./cmd/wad

          if ! diff -q /tmp/wad-1 /tmp/wad-2; then
            echo "::error::reproducibility drift on $GOARCH"
            sha256sum /tmp/wad-1 /tmp/wad-2
            exit 1
          fi
          echo "reproducible build verified on linux/$GOARCH"
