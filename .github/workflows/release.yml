name: release

on:
  push:
    tags: ['v*']

permissions: {}

# Opt into Node.js 24 for JavaScript actions ahead of the June 2026
# default switch. Mirrors ci.yml.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # FR-053 gate. GA tags (v2.0.0, v2.1.0, ...) loud-fail when
  # Apple/Homebrew/git-cliff secrets are absent — releases MUST be
  # signed, notarized, and Homebrew-published. Pre-release tags
  # (-rc, -alpha, -beta) continue to silent-skip so rehearsals
  # work without the full secret matrix.
  preflight:
    name: Preflight (FR-053 secret gate)
    runs-on: [self-hosted, dokku]
    timeout-minutes: 5
    permissions:
      # contents: read — checkout is not actually used here; the job
      # runs FR-053 secret-presence checks against env-injected
      # secrets and emits a `prerelease` output. `read` is the
      # least-privilege default.
      contents: read
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Classify tag
        id: classify
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG_NAME" in
            *-rc*|*-alpha*|*-beta*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "classified $TAG_NAME as prerelease (silent-skip permitted)"
              ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "classified $TAG_NAME as GA (FR-053 loud-fail enforced)"
              ;;
          esac

      - name: Verify GA secrets (FR-053)
        if: steps.classify.outputs.prerelease == 'false'
        env:
          APPLE_CERT: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT }}
          APPLE_KEY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_KEY }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -eu
          # FR-053 (post-rc7 amendment). Homebrew is still MUST on GA —
          # the tap is a repo-owned resource and its absence breaks the
          # published artifact path. Apple credentials are a paid,
          # Mac-issued external prerequisite (Apple Developer account +
          # Keychain-generated CSR); the gate now accepts their absence
          # with a loud `::warning::` so the solo-maintainer repo can
          # cut v2.0.0 without first purchasing a Developer account.
          # When the secrets are added later (via `gh secret set`), the
          # NEXT GA tag silently starts signing + notarising; no other
          # change is needed.
          missing_hard=""
          [ -n "${HOMEBREW_TOKEN:-}" ] || missing_hard="$missing_hard HOMEBREW_TAP_GITHUB_TOKEN"
          if [ -n "$missing_hard" ]; then
            echo "::error::FR-053: GA tag requires secrets$missing_hard"
            exit 1
          fi
          missing_soft=""
          [ -n "${APPLE_CERT:-}" ] || missing_soft="$missing_soft APPLE_DEVELOPER_ID_APPLICATION_CERT"
          [ -n "${APPLE_KEY:-}" ]  || missing_soft="$missing_soft APPLE_DEVELOPER_ID_APPLICATION_KEY"
          if [ -n "$missing_soft" ]; then
            echo "::warning::FR-053: Apple signing secrets absent ($missing_soft) — darwin binary will ship UNSIGNED. Users must run \`xattr -cr <binary>\` after download, or install via \`brew install yolo-labz/tap/wa\` (brew rebuilds from source and bypasses the quarantine flag). Populate the secrets via \`gh secret set\` before the next GA tag to re-enable notarization."
          fi
          echo "GA secret preflight OK (hard gates satisfied)"

  goreleaser:
    name: GoReleaser (build + sign + publish)
    needs: preflight
    # Self-hosted runner pool (label set [self-hosted, dokku]). The
    # release job reuses the same runners as CI so the Go module
    # cache and Nix store are already warm from the main-branch CI
    # run that preceded the tag push.
    runs-on: [self-hosted, dokku]
    timeout-minutes: 30
    permissions:
      contents: write     # softprops/action-gh-release uploads release assets.
      id-token: write     # Sigstore OIDC for cosign keyless signing of checksums.txt.
      attestations: write # attest-build-provenance@v4 + attest-sbom@v4 envelope storage.
    env:
      IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export SOURCE_DATE_EPOCH
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$SDE" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$SDE (reproducible builds)"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          # cache: false — same rationale as ci.yml: persistent module
          # cache on the self-hosted runner conflicts with actions/cache.
          cache: false

      # Install rcodesign unconditionally into a user-writable bindir.
      # When Apple signing credentials are not set, the goreleaser
      # post-hook graceful-degrades per PR #10 — rcodesign itself is
      # cheap to install (~5 MB, no-op if already cached on the
      # self-hosted runner) and keeps the workflow schema simple.
      - name: Install rcodesign
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          if ! [ -x "$HOME/.local/bin/rcodesign" ]; then
            curl -sSL \
              https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz \
              | tar -xz --strip-components=1 -C "$HOME/.local/bin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rcodesign" --version

      - name: Decode Apple credentials
        # FR-053 (post-v2.0.0 amendment). Apple credentials are a paid,
        # Mac-issued external prerequisite — the preflight soft-warned
        # on GA when absent; this step mirrors that, decoding when set
        # and silent-skipping otherwise. The downstream GoReleaser post
        # hook already no-ops rcodesign when RCODESIGN_PEM_CERT is
        # unset, so an empty decode here degrades gracefully to an
        # unsigned darwin tarball (documented user-facing via the
        # README `xattr -cr` hint).
        env:
          APPLE_CERT: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT }}
          APPLE_KEY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_KEY }}
          APPLE_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -eu
          if [ -n "${APPLE_CERT:-}" ]; then
            printf '%s' "$APPLE_CERT" | base64 -d > /tmp/cert.pem
            printf '%s' "$APPLE_KEY"  | base64 -d > /tmp/key.pem
            printf '%s' "$APPLE_P8"   | base64 -d > /tmp/api.p8
            echo "apple_secrets=set" >> "$GITHUB_OUTPUT"
          else
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "::warning::FR-053: Apple signing secrets absent on GA tag — darwin binary will ship UNSIGNED. Users must run \`xattr -cr <binary>\` after download, or install via \`brew install yolo-labz/tap/wa\` (brew rebuilds from source and bypasses the quarantine flag). Populate APPLE_DEVELOPER_ID_APPLICATION_{CERT,KEY} + APPLE_API_KEY via \`gh secret set\` before the next GA tag to re-enable notarization."
            else
              echo "prerelease: Apple secrets absent, rcodesign will skip"
            fi
            echo "apple_secrets=unset" >> "$GITHUB_OUTPUT"
          fi
        id: apple

      - name: Install cyclonedx-gomod
        # Pinned version — moving-tag `@latest` bit us once already on
        # goreleaser itself. The v1.9.0 release is the current stable
        # line (2025-08) with Go 1.24 compatibility.
        run: |
          set -eu
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install cosign
        run: |
          if ! command -v cosign >/dev/null 2>&1; then
            curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o "$HOME/.local/bin/cosign"
            chmod +x "$HOME/.local/bin/cosign"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Pinned to a version validated locally (2026-04-11). The
          # `latest` moving tag bit us once already — `v0.1.0` failed
          # because the config fields had renamed under us. Bumps
          # should happen via an explicit PR that re-runs
          # `goreleaser check` + `goreleaser release --snapshot`
          # locally first.
          version: v2.6.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If the tap secret is absent, export an empty string so the
          # goreleaser skip_upload template resolves to `true` and the
          # brew publication is skipped gracefully.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # rcodesign env vars are only exported when Apple secrets are
          # actually configured, so the inner sh -c check in the hook
          # detects the unset case and skips.
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.apple_secrets == 'set' && '/tmp/api.p8' || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          RCODESIGN_PEM_CERT: ${{ steps.apple.outputs.apple_secrets == 'set' && '/tmp/cert.pem' || '' }}
          RCODESIGN_PEM_KEY: ${{ steps.apple.outputs.apple_secrets == 'set' && '/tmp/key.pem' || '' }}

      - name: Generate SBOMs via syft (CycloneDX 1.6 + SPDX 2.3)
        # syft (anchore) currently supports CycloneDX up to 1.6 only; 1.7
        # is not yet in the syft output matrix as of this release. The
        # yolo-labz release-engineering spec calls for "1.7 or latest";
        # we hold at 1.6 until syft ships 1.7 support. Bump on sight when
        # `syft -o help` lists 1.7.
        # syft installation pinned to v1.43.0 with sha256 verify so the
        # release pipeline does NOT pipe an unpinned `main/install.sh`
        # into a shell. Closes the OpenSSF Scorecard
        # `Pinned-Dependencies` finding (`downloadThenRun not pinned by
        # hash`). Bump the version + sha256 in lockstep when syft cuts
        # a new release.
        run: |
          set -eu
          SYFT_VERSION="1.43.0"
          SYFT_AMD64_SHA256="7b98251d2d08926bb5d4639b56b1f0996a58ef6667c5830e3fe3cd3ad5f4214a"
          SYFT_ARM64_SHA256="afe92510c467f952a009b994f2d998ff8f9dd266dc26eca55d14a0dd46fec7f2"
          if ! command -v syft >/dev/null 2>&1; then
            arch="$(uname -m)"
            case "$arch" in
              x86_64) tarball_arch="amd64"; expected_sha="$SYFT_AMD64_SHA256" ;;
              aarch64|arm64) tarball_arch="arm64"; expected_sha="$SYFT_ARM64_SHA256" ;;
              *) echo "::error::unsupported arch for syft pin: $arch"; exit 1 ;;
            esac
            mkdir -p "$HOME/.local/bin"
            tarball="syft_${SYFT_VERSION}_linux_${tarball_arch}.tar.gz"
            curl -sSfL -o "/tmp/${tarball}" \
              "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${tarball}"
            actual_sha="$(sha256sum "/tmp/${tarball}" | awk '{print $1}')"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::syft tarball sha256 mismatch — expected $expected_sha got $actual_sha"
              exit 1
            fi
            tar xzf "/tmp/${tarball}" -C "$HOME/.local/bin" syft
            rm "/tmp/${tarball}"
          fi
          syft --version
          syft . \
            -o cyclonedx-json@1.6=dist/sbom.cdx.json \
            -o spdx-json=dist/sbom.spdx.json

      - name: Generate Go-native SBOM via cyclonedx-gomod
        # Richer than syft's generic CycloneDX for Go modules: includes
        # stdlib + license info + per-binary scoping. One file per
        # binary. `-licenses` hits GitHub; `-std` records stdlib deps.
        #
        # `cyclonedx-gomod app` signature: `cyclonedx-gomod app [flags]
        # [<module>]`. The positional arg is the MODULE ROOT (directory
        # containing go.mod) — not a subpackage. The specific main
        # package is selected via `-main <rel-path>`. Passing
        # `./cmd/wad` as the positional arg (rc4, rc5) triggered
        # `failed to load modules: not a go module` because cmd/wad has
        # no go.mod of its own.
        run: |
          set -eu
          cyclonedx-gomod app -licenses -std -json \
            -main cmd/wad \
            -output dist/sbom.gomod.wad.cdx.json .
          cyclonedx-gomod app -licenses -std -json \
            -main cmd/wa \
            -output dist/sbom.gomod.wa.cdx.json .

      # `subject-checksums` reads `dist/checksums.txt` and creates one
      # attestation per listed artifact (the .tar.gz, .deb, .rpm, .apk
      # files). Earlier passes used `subject-path: 'dist/checksums.txt'`
      # which only attested the manifest file itself — `gh attestation
      # verify <tarball>` then 404'd because the tarball's own digest
      # was never registered. Verified on v2.0.4 release artefacts.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-checksums: 'dist/checksums.txt'

      - name: Attest SBOM (CycloneDX 1.7)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: 'dist/checksums.txt'
          sbom-path: 'dist/sbom.cdx.json'

      - name: Attest SBOM (SPDX 2.3)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: 'dist/checksums.txt'
          sbom-path: 'dist/sbom.spdx.json'

      - name: Attest SBOM (Go-native, wad)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: 'dist/checksums.txt'
          sbom-path: 'dist/sbom.gomod.wad.cdx.json'

      - name: Attest SBOM (Go-native, wa)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: 'dist/checksums.txt'
          sbom-path: 'dist/sbom.gomod.wa.cdx.json'

      - name: Upload SBOMs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          gh release upload "$TAG_NAME" \
            dist/sbom.cdx.json \
            dist/sbom.spdx.json \
            dist/sbom.gomod.wad.cdx.json \
            dist/sbom.gomod.wa.cdx.json \
            --clobber

      - name: Install git-cliff
        # Pinned version. GA tags require git-cliff; prereleases can
        # survive install failure via the conditional skip below.
        #
        # We fetch the pre-built linux-x86_64 tarball from the upstream
        # release (orhun/git-cliff) rather than `pip install git-cliff`
        # — the Dokku self-hosted runners ship Debian 12 Python whose
        # system pip refuses installs with PEP 668
        # `externally-managed-environment`. Using the official binary
        # release is both faster and avoids the venv dance.
        run: |
          set -eu
          GC_VERSION=2.6.1
          GC_ARCH=x86_64-unknown-linux-gnu
          GC_TARBALL="git-cliff-${GC_VERSION}-${GC_ARCH}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL \
            "https://github.com/orhun/git-cliff/releases/download/v${GC_VERSION}/${GC_TARBALL}" \
            -o "/tmp/${GC_TARBALL}"
          tar -xzf "/tmp/${GC_TARBALL}" -C /tmp
          install -m 0755 "/tmp/git-cliff-${GC_VERSION}/git-cliff" "$HOME/.local/bin/git-cliff"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/git-cliff" --version

      - name: Generate CHANGELOG
        # FR-053: GA MUST produce a CHANGELOG. Prereleases may silent-skip.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if ! git-cliff -o CHANGELOG.md; then
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "::error::FR-053: git-cliff failed on GA tag"
              exit 1
            fi
            echo "prerelease: git-cliff failed, skipping"
          fi

      # CHANGELOG.md is attached to the GitHub release page instead of
      # being pushed back to main. Pushing to a protected branch from
      # within a release workflow requires a PAT and is fragile; the
      # release notes themselves capture the same information. If
      # operators want a committed CHANGELOG.md they can run
      # `git-cliff -o CHANGELOG.md` locally and commit manually.
      - name: Attach CHANGELOG to release
        if: hashFiles('CHANGELOG.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          gh release upload "$TAG_NAME" CHANGELOG.md --clobber

  # Reproducibility gate. Builds wad twice with SOURCE_DATE_EPOCH
  # pinned and diffs the bytes — any drift is a reproducibility
  # regression (non-deterministic compilation, embedded timestamp,
  # path leak). Matrix over amd64+arm64 since go build behaviour
  # can differ across targets.
  reproducibility:
    name: Reproducibility (release-time double-build)
    needs: preflight
    runs-on: [self-hosted, dokku]
    timeout-minutes: 15
    permissions:
      # contents: read — checkout the tag's source for the
      # double-build byte-identity check. No upload surface — results
      # are diff'd in-job and emit `::error` on mismatch.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Double-build and diff
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          set -eu
          export GOOS=linux
          export CGO_ENABLED=0
          # Split declare + assign so `git log` exit code is not masked
          # by `export` (shellcheck SC2155).
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          COMMIT=$(git rev-parse HEAD)
          CDATE=$(git log -1 --format=%cI)
          LDFLAGS="-s -w -X main.version=repro -X main.commit=$COMMIT -X main.date=$CDATE"

          go build -trimpath -buildvcs=true \
            -ldflags "$LDFLAGS" \
            -o /tmp/wad-1 ./cmd/wad
          sleep 2
          go build -trimpath -buildvcs=true \
            -ldflags "$LDFLAGS" \
            -o /tmp/wad-2 ./cmd/wad

          if ! diff -q /tmp/wad-1 /tmp/wad-2; then
            echo "::error::reproducibility drift on $GOARCH"
            sha256sum /tmp/wad-1 /tmp/wad-2
            exit 1
          fi
          echo "reproducible build verified on linux/$GOARCH"
