name: Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    # Required check on `main` per branch protection. Without
    # `pull_request` here, no PR can satisfy it and every merge gets
    # blocked with "base branch policy prohibits the merge". Run on
    # every PR — `paths-ignore` would skip docs-only PRs but the cost
    # of a 2-minute snapshot build per PR is acceptable.
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-twice:
    name: Reproducible build check
    # Self-hosted pool — Go toolchain + goreleaser already cached from
    # ci.yml / release.yml. Eliminates GHA hosted-runner minutes for the
    # `pull_request` trigger that fires on every PR.
    runs-on: [self-hosted, dokku]
    timeout-minutes: 15
    permissions:
      # contents: read — checkout the repo source for the double-build
      # snapshot run. No upload surface; results are diff'd in-job.
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          # cache: false — same rationale as ci.yml: persistent module
          # cache on the self-hosted dokku runner conflicts with
          # actions/cache (tar "File exists" on restore over the
          # already-warm $HOME/go/pkg/mod). Closes one of the
          # zizmor `cache-poisoning` findings tracked in PR #60's
          # revert commit.
          cache: false

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.6.1
          install-only: true

      # VM103 runner services share $HOME; keep the intentional cache wipe
      # below local to this runner so it cannot race sibling Go builds.
      - name: First build (snapshot)
        env:
          GOCACHE: ${{ runner.temp }}/go-build
        run: |
          set -eu
          # Split declare + assign so `git log` exit is not masked by
          # `export` (shellcheck SC2155).
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          goreleaser release --snapshot --clean --skip=sign,homebrew
          cp dist/checksums.txt "$RUNNER_TEMP/repro-build-1-checksums.txt"

      - name: Second build (snapshot, cold Go cache)
        env:
          GOCACHE: ${{ runner.temp }}/go-build
        run: |
          set -eu
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          # Invalidate Go's build cache to force a real recompile instead
          # of a cache hit. Previously this step touch'd every file to the
          # same end, but that dirtied git's stat cache and made -buildvcs
          # stamp vcs.modified=true in build 2 only, breaking byte-identity.
          go clean -cache
          goreleaser release --snapshot --clean --skip=sign,homebrew
          cp dist/checksums.txt "$RUNNER_TEMP/repro-build-2-checksums.txt"

      - name: Compare checksums
        run: |
          set -eu
          first="$RUNNER_TEMP/repro-build-1-checksums.txt"
          second="$RUNNER_TEMP/repro-build-2-checksums.txt"
          digest1=$(sha256sum "$first")
          digest2=$(sha256sum "$second")
          sha1=${digest1%% *}
          sha2=${digest2%% *}
          echo "Build 1 checksums: $sha1"
          echo "Build 2 checksums: $sha2"
          if [ "$sha1" != "$sha2" ]; then
            echo "::error::Reproducibility broken — checksums differ"
            diff "$first" "$second" || true
            exit 1
          fi
          echo "PASS: byte-identical builds"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-debug
          path: |
            ${{ runner.temp }}/repro-build-1-checksums.txt
            ${{ runner.temp }}/repro-build-2-checksums.txt
          retention-days: 5
