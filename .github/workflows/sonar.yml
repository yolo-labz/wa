name: SonarQube scan

# push[main] + manual dispatch only. yolo-labz_wa is a single-branch
# Community project: a pull_request scan is not a PR analysis, it
# overwrites main's analysis with an unrelated branch's tree.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One scan per ref, queued rather than cancelled: every surviving trigger
# is a main push or a manual dispatch, and each main analysis is a
# measurement worth finishing, so nothing is superseded.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level permissions — least-privilege baseline that every job
# inherits unless it overrides. zizmor `undocumented-permissions` rule
# wants an inline rationale per grant.
permissions:
  contents: read       # checkout the repo source for the scan.

jobs:
  scan:
    name: SonarQube standalone scan
    runs-on: [self-hosted, dokku]
    # 20, not 10: the coverage run shares two self-hosted runners with
    # ci.yml, and a contended run took 10m23s before the old limit killed
    # it mid-step (issue #319). The step cannot hang indefinitely on a real
    # failure — `|| true` only swallows non-zero exits, not wall time.
    timeout-minutes: 20
    permissions:
      contents: read       # same rationale as workflow level.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout (full history for blame-based coverage)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip if SonarQube host not configured
        id: check
        env:
          HOST: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [ -z "$HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SONAR_HOST_URL variable not set — skipping Sonar scan."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Go
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate Go coverage report
        if: steps.check.outputs.skip == 'false'
        run: |
          # Short, writable TMPDIR so cmd/wad's t.TempDir() unix-socket
          # tests neither EACCES on a locked-down runner /tmp nor bust the
          # 108-byte sun_path via an over-long $RUNNER_TEMP. Matches ci.yml's
          # Test job; here a flaked run would silently undercount coverage
          # (the `|| true` swallows the failure).
          mkdir -p "$HOME/.wa-test-tmp"
          export TMPDIR="$HOME/.wa-test-tmp"
          # No -race here. ci.yml's `Test (go test -race)` job is the race
          # gate and is required on every PR; running the detector a second
          # time buys no coverage signal and roughly doubles this step's
          # wall time on a contended runner (issue #319).
          go test -shuffle=on -coverprofile=cover.out -covermode=atomic ./... || true
      - name: SonarQube scan
        if: steps.check.outputs.skip == 'false'
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          # PR #140: pin JAVA_TOOL_OPTIONS at the step so the inherited
          # host env (vm103 exports `-XX:+UseAESIntrinsics -XX:+UseFMA`
          # without `-XX:+UnlockDiagnosticVMOptions` prefix → JVM
          # refuses to start) cannot kill sonar-scanner. Sonar scanner
          # reads heap budget from SONAR_SCANNER_JAVA_OPTS regardless.
          JAVA_TOOL_OPTIONS: "-XX:+UnlockDiagnosticVMOptions -XX:+UseContainerSupport -XX:MaxRAMPercentage=75"
