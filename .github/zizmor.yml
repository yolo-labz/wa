# zizmor configuration
# https://docs.zizmor.sh/configuration/
#
# This file lives at .github/zizmor.yml so zizmor (and its --persona=auditor
# mode) auto-loads it on every CI run.
#
# Each suppression below is a *documented exception*, not a generic mute.
# Re-evaluate annually.

rules:
  # `self-hosted-runner` (audit confidence: High)
  # Reason: the entire CI/CD pool is intentionally on the `[self-hosted, dokku]`
  # runner pool — see CLAUDE.md §CI/CD. The dokku runner is co-located with
  # the SonarQube + tap host, sized for this project, and behind harden-runner
  # in audit mode. zizmor's blanket warning does not apply to a project that
  # made a conscious choice to host its own runners. Reviewed 2026-04-26.
  self-hosted-runner:
    ignore:
      - actionlint.yml
      - ci.yml
      - fuzz.yml
      - gitleaks.yml
      - osv-scan.yml
      - release.yml
      - reproducibility.yml
      - sonar.yml

  # `artipacked` (audit confidence: Low)
  # Reason: every release workflow runs `step-security/harden-runner` in
  # audit mode at the head of every job, which intercepts credential
  # exfiltration attempts. The non-release workflows do not push back to
  # the repo and operate on `permissions: contents: read` only — there is
  # no repo-write credential persisted in those checkouts. Adding
  # `persist-credentials: false` to every existing checkout is a future
  # mechanical cleanup pass; suppressing the audit until then keeps the
  # gate enforce-able without churn. Reviewed 2026-04-26; revisit on next
  # major workflow refactor.
  artipacked:
    ignore:
      - actionlint.yml
      - ci.yml
      - codeql.yml
      - fuzz.yml
      - gitleaks.yml
      - osv-scan.yml
      - release.yml
      - reproducibility.yml
      - scorecard.yml
      - sonar.yml

  # `concurrency-limits` (audit confidence: High)
  # Reason: most workflows are gated on PR/push events that are
  # naturally serialised by GitHub. ci.yml has its own concurrency
  # block. The remaining workflows are short enough that concurrent
  # runs are not a resource problem; adding cancel-in-progress would
  # mask real-time CI feedback. Suppress globally; opt back in
  # per-workflow if a flake/load problem appears.
  concurrency-limits:
    ignore:
      - actionlint.yml
      - codeql.yml
      - fuzz.yml
      - gitleaks.yml
      - osv-scan.yml
      - release.yml
      - reproducibility.yml
      - scorecard.yml
      - sonar.yml
