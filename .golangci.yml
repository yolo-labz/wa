version: "2"

run:
  timeout: 5m
  # Aligned with go.mod's `go 1.26.3` directive (PR #156). golangci-lint
  # uses this for go-version-specific lint behaviour (e.g. minimum
  # version checks for stdlib API stability).
  go: "1.26"

# Surface every finding in one CI run instead of capping at the v1
# default of 50 issues per linter / 3 issues per linter+file. Without
# this, enabling a new linter takes 2-3 PR cycles to clear because
# each pass only reveals the first batch.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - depguard
    - errcheck
    # errorlint catches `if err == ErrFoo` patterns that should be
    # `errors.Is(err, ErrFoo)` (Go 1.13+) — wrapped errors from upstream
    # libraries (whatsmeow, sqlite) are equality-compared incorrectly
    # otherwise. Also flags deprecated `errors.Wrap` patterns.
    - errorlint
    - forbidigo
    # sloglint enforces structured-logging discipline against the
    # ~47 files that import `log/slog`. Defaults catch the most common
    # mistakes: mixing key-value with Attr(), missing context arg,
    # non-static msg strings. Repo-specific tightening can be added
    # via `settings.sloglint` if false-positive rate is low.
    - sloglint
    # wastedassign — flags assignments whose value is overwritten
    # before being read. Narrow, low-FP, catches real dead-code bugs
    # (typo'd variable name shadowed by next assignment, missed early
    # return, etc.).
    - wastedassign
    # misspell — flags typos in comments + string literals. American
    # English by default; doesn't flag intentional log keys or
    # identifiers. The cost is ~50 ms per file at lint time.
    - misspell
    # predeclared — flags names that shadow predeclared identifiers
    # (`new`, `error`, `len`, `make`, etc.). Narrow + zero false-
    # positives in idiomatic Go. Catches shadow bugs that compile
    # cleanly but produce confusing reads.
    - predeclared
    # dupword — flags accidentally repeated words in comments / strings
    # (e.g. "the the", "a a"). Cheap class of typo beyond `misspell`.
    - dupword
    # nilnil — flags functions that return both a nil error AND a nil
    # pointer/interface result. Caller can't distinguish "no error,
    # absent value" from "no error, value present" — anti-pattern that
    # leads to nil-pointer panics downstream. Narrow + zero false-
    # positives in idiomatic Go.
    - nilnil
    # bodyclose — flags `*http.Response.Body` that escapes the function
    # without a `Close()`. Classic file-descriptor / connection-pool
    # leak. Narrow surface (only fires where net/http is imported), low
    # FP rate. Probes any HTTP client paths in install scripts +
    # adapter code.
    - bodyclose
    # unconvert — flags type conversions that are no-ops because the
    # source and dest types already match. Catches drift after a type
    # rename or refactor.
    - unconvert
    # noctx — flags HTTP/net/exec calls created without a context.
    # Daemon hot path (socket/listener.go, server.go, testing_support.go,
    # peercred_test.go) now threads ctx through `Server.Run`. CLI/test
    # paths use `context.Background()` (fire-and-forget like browser
    # spawn) or `t.Context()`/`b.Context()` (Go 1.24+) where natural.
    # Per-site rationale documented inline. Closed in PR #92.
    - noctx
    # gocheckcompilerdirectives — validates Go compiler directives
    # (`//go:build`, `//go:noinline`, `//go:nosplit`, etc.). Narrow,
    # virtually zero false-positives. Catches typos that silently
    # disable the directive (e.g. `// go:build` with a space).
    - gocheckcompilerdirectives
    # usestdlibvars — flags magic strings/numbers that have an
    # equivalent stdlib constant. Most common: `"GET"` → `http.MethodGet`,
    # `200` → `http.StatusOK`, `"unix"` → `unix.NetworkName` (no, that
    # last one isn't real — but the linter knows the real ones).
    # Improves call-site readability + makes upstream API renames
    # safer.
    - usestdlibvars
    # intrange — flags `for i := 0; i < N; i++` loops that could use
    # the Go 1.22+ `for i := range N` syntax. Pure modernization; the
    # repo's go.mod toolchain is 1.26.3 so this is fully supported.
    - intrange
    # tparallel — flags improper t.Parallel use (parent test calling
    # t.Parallel() before subtests, inconsistent t.Setenv + Parallel,
    # etc.). Narrow + catches real test ordering bugs.
    - tparallel
    # nolintlint — meta-linter validates `//nolint` comments are
    # well-formed (specific linter named, rationale present). After
    # the many `//nolint` additions in PR #80/#81/#86/#88, worth
    # checking shape consistency.
    - nolintlint
    # nakedret — flags naked returns in long functions. Free coverage
    # — repo currently has zero, so enabling is a no-cost guard.
    - nakedret
    # prealloc — flags slice append loops that could prealloc. Free
    # coverage; repo currently has zero.
    - prealloc
    # whitespace — flags leading/trailing blank lines in functions
    # and struct literals. Free coverage; repo currently has zero.
    - whitespace
    - gocritic
    - gocyclo
    - gosec
    - govet
    - revive
    - staticcheck
    # Spec 016 FR-007 / T056 (Tier 1): sqlclosecheck verifies that
    # *sql.Rows and *sql.Stmt values are closed on every code path.
    # Catches the silent-leak shape that PR #117 (rows.Close logging)
    # was a downstream symptom of.
    - sqlclosecheck
    # Spec 016 FR-007 / T058 (Tier 3): perfsprint flags fmt.Sprintf
    # / fmt.Errorf calls that have a faster strconv-or-concat
    # equivalent. Surface zero-cost; cleans up `fmt.Sprintf("%d", n)`
    # → `strconv.Itoa(n)` style.
    - perfsprint
    # Spec 016 FR-007 / T058 (Tier 3): fatcontext catches passing a
    # parent ctx into a goroutine launched inside a loop where the
    # ctx is the loop's per-iteration child — a memory-leak shape
    # the runtime cannot catch.
    - fatcontext
    # Spec 016 FR-007 / T059 (Tier 1): wrapcheck would land here.
    # Drafted the `ignorePackageGlobs: ["fmt"]` + ignoreSigs config
    # below; running `golangci-lint run` against current main with
    # wrapcheck enabled surfaced 325 violations across internal/* +
    # cmd/*. Most are legitimate (json.Marshal pass-through, ctx.Err
    # in cancellation surfaces, std-lib errors propagated at primary-
    # adapter boundaries). Fixing all 325 is iterative US4-T062 work
    # outside the scope of a single PR. Linter stays DISABLED with
    # the config retained as a follow-up landing target.
    # - wrapcheck  # disabled: 325 violations on main; defer to T062 follow-up
  settings:
    gocyclo:
      min-complexity: 15
    # wrapcheck settings block removed in PR #142: the linter is held
    # disabled per the comment above (T059 drafted; T062 follow-up).
    # golangci-lint v2.11+ schema renamed `ignorePackageGlobs` /
    # `ignoreSigs` to `ignore-package-globs` / `ignore-sigs`. Rather
    # than carry stale config under a disabled linter, drop it entirely;
    # T062 will reintroduce in the new schema when the 325-violation
    # cleanup lands.
    depguard:
      rules:
        # The single most important architectural invariant in this repo:
        # the hexagonal core (internal/domain, internal/app) must NOT import
        # the WhatsApp library. All whatsmeow types must be translated at the
        # secondary adapter boundary in internal/adapters/secondary/whatsmeow.
        core-no-whatsmeow:
          list-mode: lax
          files:
            - "**/internal/domain/**"
            - "**/internal/app/**"
          deny:
            - pkg: "go.mau.fi/whatsmeow"
              desc: "domain/app must not import whatsmeow; use a port interface in internal/app/ports.go"
            - pkg: "go.mau.fi/whatsmeow/types"
              desc: "domain/app must not import whatsmeow/types; translate to domain.JID at the adapter boundary"
            - pkg: "go.mau.fi/whatsmeow/binary"
              desc: "domain/app must not import whatsmeow/binary"
            - pkg: "go.mau.fi/whatsmeow/store"
              desc: "domain/app must not import whatsmeow/store"
        # Testing contract (constitution v1.1.0): test files must not reach
        # go.mau.fi/whatsmeow outside the integration build tag. The
        # whatsmeow adapter's own package tests are exempt — they exercise
        # JID/event translation and adapter lifecycle against in-package
        # fakes with no network access; tagging them `integration` would
        # remove that coverage from CI. Integration-tagged files never
        # reach this rule (lint runs without the tag).
        tests-no-whatsmeow:
          list-mode: lax
          files:
            - "**/*_test.go"
            - "!**/internal/adapters/secondary/whatsmeow/**"
          deny:
            - pkg: "go.mau.fi/whatsmeow"
              desc: "tests outside the whatsmeow adapter must not import whatsmeow; use memory fakes or gate behind //go:build integration"
        app-no-adapters:
          list-mode: lax
          files:
            - "**/internal/app/**"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/yolo-labz/wa/v2/internal/adapters"
              desc: "app layer must not import adapters; use port interfaces"
        adapters-primary-no-whatsmeow:
          list-mode: lax
          files:
            - "**/internal/adapters/primary/**"
          deny:
            - pkg: "go.mau.fi/whatsmeow"
              desc: "primary adapters must not import whatsmeow; only secondary adapters translate WA types"
            - pkg: "go.mau.fi/whatsmeow/types"
              desc: "primary adapters must not import whatsmeow/types; use domain types"
            - pkg: "go.mau.fi/whatsmeow/binary"
              desc: "primary adapters must not import whatsmeow/binary"
            - pkg: "go.mau.fi/whatsmeow/store"
              desc: "primary adapters must not import whatsmeow/store"
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^panic$'
          msg: "panic is only allowed in package main; return errors instead"
        - pattern: '^fmt\.Print.*$'
          msg: "fmt.Print* is only allowed under cmd/; use the slog logger or return values"
        # Feature 008 FR-049: profile names MUST NEVER be string-interpolated
        # into shell command strings. They must be passed as separate argv
        # elements to os/exec.Command. This pattern catches the common
        # foot-gun of fmt.Sprintf-ing a profile name into a shell string.
        # The regex matches `exec.Command(... fmt.Sprintf(... profile ...))`.
        - pattern: 'exec\.Command.*fmt\.Sprintf.*profile'
          msg: "FR-049: profile names must be passed as separate argv elements, not interpolated into shell strings"
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-naming
        - name: var-naming
  exclusions:
    rules:
      - path: "cmd/"
        linters: [forbidigo]
      - path: "main\\.go"
        linters: [forbidigo]
      - path: "_test\\.go"
        linters: [gosec, gocyclo, forbidigo]
      # Contract runners under internal/app/porttest/ enumerate
      # adapter-agnostic sub-tests; their branch count tracks the
      # number of LM1..LMn / IS1..ISn assertions, not implementation
      # complexity. Exclude gocyclo there.
      - path: "internal/app/porttest/"
        linters: [gocyclo]

formatters:
  enable: [gofumpt]
