version: 2
project_name: wa

before:
  hooks:
    - go mod tidy

builds:
  - id: wa
    main: ./cmd/wa
    binary: wa
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    flags: [-trimpath, -buildvcs=true]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'
    # rcodesign post-build hook for darwin binaries.
    # The hook only runs when RCODESIGN_PEM_CERT and RCODESIGN_PEM_KEY are set
    # (i.e. in CI after the "Decode Apple credentials" step).
    # Locally, goreleaser release --snapshot skips hooks that reference
    # missing env vars — no action needed for local dev.
    hooks:
      post:
        # rcodesign post-hook for darwin binaries. Wraps every check in
        # a single `sh -c` command so goreleaser always sees a non-empty
        # command string (empty commands panic the internal shell
        # runner). The shell then decides whether to actually invoke
        # rcodesign:
        #
        #   1. If the just-built binary is NOT darwin → no-op (exit 0)
        #   2. If Apple signing credentials are NOT set → no-op
        #   3. Else → sign in place
        #
        # This lets the release pipeline produce unsigned darwin
        # binaries + linux tarballs when the Apple secrets are absent
        # (graceful degradation). Local `goreleaser release --snapshot`
        # runs without any of the secrets and still succeeds.
        - cmd: |-
            sh -c 'test "{{ .Os }}" = "darwin" || exit 0; test -n "${RCODESIGN_PEM_CERT:-}" || { echo "skip rcodesign (cert unset)"; exit 0; }; rcodesign sign --code-signature-flags runtime --pem-source "$RCODESIGN_PEM_CERT" --pem-source "$RCODESIGN_PEM_KEY" "{{ .Path }}"'
          output: true

  - id: wad
    main: ./cmd/wad
    binary: wad
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    flags: [-trimpath, -buildvcs=true]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'
    hooks:
      post:
        # rcodesign post-hook for darwin binaries. Wraps every check in
        # a single `sh -c` command so goreleaser always sees a non-empty
        # command string (empty commands panic the internal shell
        # runner). The shell then decides whether to actually invoke
        # rcodesign:
        #
        #   1. If the just-built binary is NOT darwin → no-op (exit 0)
        #   2. If Apple signing credentials are NOT set → no-op
        #   3. Else → sign in place
        #
        # This lets the release pipeline produce unsigned darwin
        # binaries + linux tarballs when the Apple secrets are absent
        # (graceful degradation). Local `goreleaser release --snapshot`
        # runs without any of the secrets and still succeeds.
        - cmd: |-
            sh -c 'test "{{ .Os }}" = "darwin" || exit 0; test -n "${RCODESIGN_PEM_CERT:-}" || { echo "skip rcodesign (cert unset)"; exit 0; }; rcodesign sign --code-signature-flags runtime --pem-source "$RCODESIGN_PEM_CERT" --pem-source "$RCODESIGN_PEM_KEY" "{{ .Path }}"'
          output: true

# gomod.proxy is intentionally disabled. Enabling it tells goreleaser
# to `go mod download` from the proxy using `<module>@<tag>` — which
# fails on v2+ tags unless the module path itself ends in `/v2`
# (Go modules major-version rule). This repo ships binaries, not a
# Go library, so there is no benefit to proxy-mode builds. See
# rc1/rc2 failures (2026-04-22) for the incident trail.
gomod:
  proxy: false

archives:
  - id: default
    builds: [wa, wad]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # `formats` (plural) is the current schema since GoReleaser
    # deprecated `format` (singular). Functionally identical for one
    # format; future use can list multiple.
    formats: [tar.gz]

# SBOMs are generated via syft in a separate workflow step (not goreleaser)
# to avoid cyclonedx-gomod binary/module path confusion in per-artifact mode.

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude: ['^docs:', '^test:', '^chore:']

release:
  github:
    owner: yolo-labz
    name: wa
  draft: false
  prerelease: auto

nfpms:
  # Linux native packages — Debian/Ubuntu (.deb) + RHEL/Fedora/SUSE (.rpm) +
  # Alpine (.apk). Closes the "easy to install on linux" gap for users
  # who don't run Homebrew/Linuxbrew. The packages are unsigned in this
  # release; signing requires GPG/RPM-sign keys which are out of scope
  # for the solo-maintainer profile (ship the SHA256 + Sigstore bundle
  # over the tarball as the integrity gate; package managers verify
  # via the same checksums.txt).
  #
  # Install:
  #   sudo dpkg -i wa_<version>_linux_amd64.deb
  #   sudo rpm -i  wa_<version>_linux_amd64.rpm
  #   sudo apk add --allow-untrusted wa_<version>_linux_amd64.apk
  - id: wa
    package_name: wa
    builds: [wa, wad]
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: "https://github.com/yolo-labz/wa"
    description: "WhatsApp automation CLI + daemon (CLI + long-running session daemon)"
    maintainer: "Pedro H S Balbino <pedrobalbino@pm.me>"
    license: "Apache-2.0"
    vendor: "yolo-labz"
    section: net
    priority: optional
    formats: [deb, rpm, apk]
    bindir: /usr/local/bin
    # systemd user unit + completion files are NOT shipped in the .deb
    # by design — `wad install-service` writes the unit at first run
    # under `~/.config/systemd/user/`, which is the only path that
    # works for an unprivileged daemon (the package manager would
    # need root to drop a system unit, and `wad` MUST NOT run as
    # root per project rule §IPC + §FS-layout).
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/wa/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/wa/README.md
        file_info:
          mode: 0644
    # The .rpm overrides reduce metadata noise on RHEL/Fedora.
    rpm:
      group: Applications/Internet
      compression: zstd
    # .deb overrides set the proper architecture mapping (Debian uses
    # `amd64`/`arm64` which goreleaser's default already aligns with).
    deb:
      compression: zstd
    apk:
      # Alpine builds use musl; our binaries are CGO-free so static
      # against glibc/musl is irrelevant. Mark as `--no-arch` if the
      # consumer wants to install across architectures (rare).

brews:
  - name: wa
    # Gracefully skip the Homebrew publication when the tap token is
    # empty. The release workflow always exports
    # HOMEBREW_TAP_GITHUB_TOKEN (via `${{ secrets.X }}` which becomes
    # empty string if the secret is unset), so .Env access is safe.
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_GITHUB_TOKEN "" }}true{{ else }}false{{ end }}'
    repository:
      owner: yolo-labz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/yolo-labz/wa"
    description: "WhatsApp automation CLI + daemon"
    license: "Apache-2.0"
    install: |
      bin.install "wa"
      bin.install "wad"
    test: |
      system "#{bin}/wa", "--version"
