<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="wa-hero-title wa-hero-desc">
  <title id="wa-hero-title">wa: persistent WhatsApp daemon for Claude Code</title>
  <desc id="wa-hero-desc">Catppuccin Mocha card. Left panel shows the wordmark wa in mauve over a monospaced tagline. Right panel shows a sine wave intersecting a chat-bubble glyph, with the gremlin's head anchoring the lower-right corner.</desc>
