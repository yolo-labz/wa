<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>wa admin</title><link rel="stylesheet" href="/admin/static/admin.css"></head>
<body>
<main>
<h1>wa admin · {{.Profile}}</h1>

</form>
</main>
</body>
</html>
