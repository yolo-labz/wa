# lefthook.yml — git hooks for the wa repo
# Install: `lefthook install` (brew install lefthook | go install github.com/evilmartians/lefthook@latest)
# Skip in CI: lefthook auto-skips when CI=true.

pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: |
        unformatted=$(gofmt -l {staged_files})
        if [ -n "$unformatted" ]; then
          echo "gofmt: the following files need formatting:"
          echo "$unformatted"
          echo "run: gofmt -w ."
          exit 1
        fi
    govet:
      glob: "*.go"
      run: go vet ./...
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --new-from-rev=HEAD~1
    gomod-tidy:
      glob: "{go.mod,go.sum}"
      run: |
        go mod tidy
        if ! git diff --quiet go.mod go.sum; then
          echo "go.mod / go.sum out of sync; run 'go mod tidy' and re-stage"
          exit 1
        fi

pre-push:
  commands:
    test-race:
      run: go test -race -count=1 ./...
    go-fix:
      glob: "*.go"
      run: |
        go fix ./...
        if ! git diff --quiet; then
          echo "go fix applied modernizations; stage the changes and re-push"
          exit 1
        fi
    sonar-local:
      # Opt-in — set LOCAL_SONAR=1 in your shell to enable.
      # A full scan takes 30–90s, so it is gated to keep `git push` fast
      # for everyday work. Run on its own with `make sonar-local` when
      # you want a pre-PR sanity check.
      run: |
        if [ "$LOCAL_SONAR" = "1" ]; then
          make sonar-local
        else
          echo "(skipping local Sonar; set LOCAL_SONAR=1 to enable)"
        fi
    gitleaks:
      # Always-on secret scan. gitleaks runs on the diff between the
      # remote and the pushed commit range — fast (~200 ms typical).
      # Plugs the gap that Sonar Community Build does not cover (the
      # 400+ secret-pattern engine is paywalled in Developer Edition).
      # If gitleaks is not installed, skip with a hint instead of
      # blocking the push.
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --redact --no-banner --pre-commit
        else
          echo "(skipping gitleaks; install via: brew install gitleaks)"
        fi
    actionlint:
      # Workflow YAML lint. Catches invalid expressions, missing
      # `permissions:`, deprecated actions, shellcheck issues inside
      # `run:` steps. Soft-skip when not installed.
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        if command -v actionlint >/dev/null 2>&1; then
          actionlint
        else
          echo "(skipping actionlint; install via: brew install actionlint)"
        fi
    zizmor:
      # Static-analysis security audit for GitHub Actions workflows.
      # Catches template injection (e.g. `${{ github.head_ref }}` in
      # `run:`), unpinned third-party actions, over-broad permissions,
      # cache-poisoning patterns. Soft-skip when not installed.
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        if command -v zizmor >/dev/null 2>&1; then
          zizmor --persona=auditor .github/workflows/ || true
        else
          echo "(skipping zizmor; install via: pipx install zizmor or brew install zizmor)"
        fi

commit-msg:
  commands:
    conventional:
      run: bash scripts/commit-msg-check.sh {1}
