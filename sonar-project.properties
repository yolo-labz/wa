sonar.projectKey=yolo-labz_wa
sonar.projectName=wa
sonar.projectVersion=0.0.3

# Sources: production Go code only.
# - `internal/adapters/secondary/memory/**` is production code shipped in the
#   binary (anticipated `--dry-run` mode + test fakes), so it stays on the
#   sources side. Coverage is measured against it.
# - `internal/app/porttest/**` is a shared *test* helper suite (Watermill-style
#   contract tests) consumed only by `*_test.go` files; it is moved to the
#   tests side via `sonar.test.inclusions` below.
sonar.sources=internal
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,internal/app/porttest/**

sonar.tests=internal
# `*_test.go` is the standard. `internal/app/porttest/**` is included even
# though the files do not have the `_test.go` suffix because they exist purely
# to support tests in other packages. Excluding `vendor/` and `testdata/` is
# defensive — neither is a Sonar-analyzable test source.
sonar.test.inclusions=**/*_test.go,internal/app/porttest/**
sonar.test.exclusions=**/vendor/**,**/testdata/**

# Go
sonar.go.coverage.reportPaths=cover.out

# Encoding
sonar.sourceEncoding=UTF-8

# Trim analysis-report payload to stay under reverse-proxy body limit on
# the self-hosted SonarQube (HTTP 413 on /api/ce/submit). SCM blame data
# is the largest slice; we forgo line-level author attribution in favour
# of a submit that actually reaches the server.
sonar.scm.disabled=true
