sonar.projectKey=yolo-labz_wa
sonar.projectName=wa
sonar.projectVersion=0.0.3

# Sonar source/test split for the hexagonal layout.
#
# `internal/adapters/secondary/memory/**` is currently imported only
# from `*_test.go` files (verified 2026-04-26 via repo-wide grep). The
# project's CLAUDE.md anticipates a `--dry-run` mode that would lift it
# into production composition, but until that lands the package is
# test-only and belongs on the test side.
#
# `internal/app/porttest/**` is the Watermill-style shared contract
# test suite — invoked from `*_test.go` files in adapters and use
# cases. Files do not have the `_test.go` suffix because they expose
# helpers; explicitly include via `sonar.test.inclusions`.
sonar.sources=internal
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,internal/adapters/secondary/memory/**,internal/app/porttest/**

sonar.tests=internal
sonar.test.inclusions=**/*_test.go,internal/app/porttest/**,internal/adapters/secondary/memory/**
sonar.test.exclusions=**/vendor/**,**/testdata/**

# Go
sonar.go.coverage.reportPaths=cover.out

# Encoding
sonar.sourceEncoding=UTF-8

# Trim analysis-report payload to stay under reverse-proxy body limit on
# the self-hosted SonarQube (HTTP 413 on /api/ce/submit). SCM blame data
# is the largest slice; we forgo line-level author attribution in favour
# of a submit that actually reaches the server.
sonar.scm.disabled=true
